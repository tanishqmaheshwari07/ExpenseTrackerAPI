services:
  # Spring Boot REST API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expensetracker-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/expense_tracker
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - expensetracker-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: expensetracker-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=expense_tracker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - expensetracker-network

  # Adminer (Database Management Web GUI)
  adminer:
    image: adminer:latest
    container_name: expensetracker-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - expensetracker-network

volumes:
  pgdata:
    driver: local

networks:
  expensetracker-network:
    driver: bridge
