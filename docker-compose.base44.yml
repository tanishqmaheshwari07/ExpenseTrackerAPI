services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: expensetracker-db
    environment:
      - POSTGRES_DB=expense_tracker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  # Spring Boot REST API (dev mode — runs from source)
  api:
    image: maven:3.9-eclipse-temurin-21-alpine
    working_dir: /app
    volumes:
      - ./expensetracker:/app
      - maven-cache:/root/.m2
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/expense_tracker
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "mvn spring-boot:run -DskipTests"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: on-failure

  # React + Vite frontend (dev mode — runs from source, proxies /api to backend)
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: ["sh", "-ec", "npm install && exec npm run dev -- --host 0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

volumes:
  pgdata:
  maven-cache:
  frontend-node-modules:
